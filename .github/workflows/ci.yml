name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2.0"
          use-public-rspm: true
      - name: Restore locked R dependencies
        uses: r-lib/actions/setup-renv@v2
      - name: Verify the restored R environment
        run: make check
      - name: Rebuild data, analysis, report, and tests
        run: make all
